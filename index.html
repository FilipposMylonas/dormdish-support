<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DormDish Support</title>
    <style>
        body {
            background-color: #1a1a1a; /* Dark background */
            color: #e0e0e0; /* Light gray text */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
            line-height: 1.6;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 40px 20px;
            background-color: #2c2c2c; /* Slightly lighter dark card */
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }
        h1 {
            color: #FFA500; /* Orange accent for the heading */
            margin-bottom: 20px;
            font-weight: 600;
        }
        p {
            margin-bottom: 25px;
            font-size: 1.1em;
        }
        a {
            color: #FFC107; /* Lighter orange/gold for the link */
            text-decoration: none;
            font-weight: 500;
        }
        a:hover {
            text-decoration: underline;
        }
        .email-link {
             word-break: break-all; /* Ensure long emails don't overflow */
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>DormDish Support</h1>
        <p>
            Need help with the DormDish app? Have questions or feedback?
            Please reach out to our support team via email.
        </p>
        <p>
            Contact us at:
            <a href="mailto:info.dormdish@gmail.com" class="email-link">info.dormdish@gmail.com</a>
        </p>
    </div>
</body>
</html>
